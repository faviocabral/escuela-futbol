<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Imagen a Excel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Librería SheetJS -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

/* Forzar que el navegador use toda la pantalla y centre todo */
html, body {
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
}

/* Modificar la tarjeta para que se adapte al centrado */
.modern-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    width: 90% !important; /* Deja un pequeño margen en celulares */
    max-width: 480px !important; /* Tamaño ideal en computadoras */
    padding: 30px !important;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    box-sizing: border-box;
}


        .modern-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .drop-zone {
            border: 2px dashed rgba(99, 102, 241, 0.5);
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drop-zone:hover {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .form-control-modern {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 12px;
            padding: 12px;
        }

        .form-control-modern:focus {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3) !important;
        }

        .btn-modern {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-modern:hover {
            background: var(--accent-hover);
            color: white;
            transform: scale(1.01);
        }

        #preview {
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3 m-0">

    <div class="modern-card w-100 p-4 p-sm-5 shadow-lg">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 bg-indigo-subtle rounded-circle mb-3" style="background: rgba(99, 102, 241, 0.15);">
                <i class="bi bi-file-earmark-excel text-info fs-2" style="color: #818cf8 !important;"></i>
            </div>
            <h1 class="h3 fw-bold tracking-tight mb-1">Imagen a Excel</h1>
            <p class="text-muted small">Carga tu archivo y elige la columna de destino</p>
        </div>
        
        <form id="excelForm">
            <!-- Zona de Carga de Imagen -->
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">1. Archivo de Imagen</label>
                <div class="drop-zone p-4 text-center position-relative" onclick="document.getElementById('imageInput').click()">
                    <input type="file" id="imageInput" accept="image/*" class="d-none" required>
                    <div id="dropZoneContent">
                        <i class="bi bi-cloud-arrow-up text-muted fs-1 mb-2 d-block"></i>
                        <span class="d-block fw-medium mb-1">Haz clic para buscar imagen</span>
                        <span class="text-muted small">Formatos soportados: JPG, PNG, WEBP</span>
                    </div>
                    <!-- Vista previa oculta inicialmente -->
                    <div class="text-center mt-2">
                        <img id="preview" src="#" alt="Vista previa" class="img-fluid mx-auto">
                    </div>
                </div>
            </div>

            <!-- Entrada de Columna -->
            <div class="mb-4">
                <label for="columnInput" class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">2. Columna de Destino</label>
                <div class="input-group">
                    <span class="input-group-text form-control-modern border-end-0" style="background: rgba(15, 23, 42, 0.8) !important;">
                        <i class="bi bi-grid-3x3 text-muted"></i>
                    </span>
                    <input type="text" class="form-control form-control-modern text-uppercase" id="columnInput" placeholder="Ej: A, B, C, AA" pattern="[A-Za-z]+" required>
                </div>
                <div class="form-text text-muted mt-2 small">
                    <i class="bi bi-info-circle me-1"></i> La imagen se guardará codificada en la fila 1.
                </div>
            </div>

            <!-- Botón de Envió -->
            <button type="submit" class="btn btn-modern w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-download"></i> Generar y Descargar Excel
            </button>
        </form>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const dropZoneContent = document.getElementById('dropZoneContent');
        const excelForm = document.getElementById('excelForm');

        // Escuchar el cambio de archivo para la vista previa
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    dropZoneContent.style.display = 'none'; // Ocultar texto de carga
                }
                reader.readAsDataURL(file);
            }
        });

        // Crear y procesar el archivo Excel
        excelForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const file = imageInput.files[0];
            const rawCol = document.getElementById('columnInput').value.toUpperCase();
            
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const base64String = evt.target.result; 

                const wb = XLSX.utils.book_new();
                const colIndex = XLSX.utils.decode_col(rawCol);
                
                const rowData = [];
                rowData[colIndex] = base64String; 

                const ws = XLSX.utils.aoa_to_sheet([rowData]);
                XLSX.utils.book_append_sheet(wb, ws, "Datos");

                XLSX.writeFile(wb, "imagen_procesada.xlsx");
            };

            reader.readAsDataURL(file);
        });
    </script>

</body>
</html>
