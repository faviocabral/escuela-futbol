version: '3.8'

services:
  backend-api:
    build: 
      context: .
    container_name: api-facturas
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0  # 👈 Esto soluciona el error SSL dentro del contenedor
    ports:
      - "3800:3800"
    volumes:
      - ./datos_excel:/app/data
      - .:/app # Sincroniza todo tu proyecto   
      - /app/node_modules # Evita que los node_modules del host sobrescriban los del contenedor   
    networks:
      - red_global_lector # 👈 Vinculamos el servicio del backend a la red      
    env_file:
      - .env
    restart: always
networks:
  red_global_lector:
    external: true
    name: red-compartida-lector